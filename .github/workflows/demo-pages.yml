# Publica l'app de recepció (carpeta recepcio/) a GitHub Pages.
# Requisit: Settings → Pages → Source: "GitHub Actions".
name: Publicar recepció

on:
  workflow_dispatch:
  push:
    branches: [main, claude/event-ticketing-app-0p1ga3]
    paths: ["recepcio/**", ".github/workflows/demo-pages.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: recepcio

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
