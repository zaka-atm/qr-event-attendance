# Configuración mínima para la CLI de Supabase (`supabase functions deploy`).
# Si ejecutas `supabase init` se ampliará con el resto de opciones por defecto.
project_id = "qr-event-attendance"

# Público: lo llama la página de compra con la clave anónima/publicable.
[functions.create-order]
verify_jwt = false

# Lo llama el panel de pagos con la sesión del organizador. El token lo verifica Postgres
# (y las funciones SQL comprueban is_organizer), así que funciona con claves JWT y con las nuevas.
[functions.manage-order]
verify_jwt = false
